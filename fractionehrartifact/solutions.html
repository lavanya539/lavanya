    </div>
  </div>
</div>`;
}

// ─── ROUTING & SCALING ────────────────────────────────────────────
let currentPage = null;

function gotoPage(id) {
  const page = PAGES.find(p=>p.id===id)||PAGES[0];
  if(currentPage===id) return;
  currentPage = id;
  const wrapper = document.createElement('div');
  wrapper.className = 'sw';
  wrapper.id = 'sw';
  wrapper.innerHTML = renderPage(page);
  document.getElementById('app').innerHTML = '';
  document.getElementById('app').appendChild(wrapper);
  scaleCanvas(page.h);
  window.scrollTo(0,0);
  // Close dropdowns on page click
  document.addEventListener('click', function close(e){
    if(!e.target.closest('.nav-wrap')){
      document.querySelectorAll('.nav-drop').forEach(d=>{d.style.display='none';});
    }
  });
}

function scaleCanvas(h) {
  const sw = document.getElementById('sw');
  if(!sw) return;
  const s = window.innerWidth / 1920;
  sw.style.transform = `scale(${s})`;
  document.body.style.height = (h * s) + 'px';
  document.body.style.margin = '0';
}

function toggleDrop(id, e) {
  e && e.stopPropagation();
  document.querySelectorAll('.nav-drop').forEach(function(d){
    if(d.id!=='drop-'+id) d.style.display='none';
  });
  const el = document.getElementById('drop-'+id);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
}

window.addEventListener('resize', function(){
  const p = PAGES.find(p=>p.id===currentPage)||PAGES[0];
  scaleCanvas(p.h);
});

// Initial load from hash
const hash = window.location.hash.slice(1);
const initialId = PAGES.find(p=>p.id===hash) ? hash : PAGES[0].id;
gotoPage(initialId);
  </script>
